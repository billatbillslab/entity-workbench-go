# ---------------------------------------------------------------------------
# The rolling status log — declared, and MOVED to say so.
#
# Decided 2026-08-24, matching the rest of the ecosystem:
# `docs/status/` is stripped wholesale, so the rolling log moved OUT of it to
# `docs/STATUS.md` and is declared here. The path carries the meaning —
# outside that directory is canonical, inside it is working memory — which is
# a better instrument than a keep-list entry that a reader of the tree cannot
# see. The 20 dated `STATUS-YYYY-MM-DD.md` snapshots and the `HANDOFF-*` files
# stay in `docs/status/` and stay unpublished, which is [ADR-0031] working as
# intended rather than being overridden.
#
# The consequence, stated rather than discovered: this file is now a canonical
# doc, so it is in scope for the pin checker and for anyone at all. It is still
# written for the next session first — that is what makes it useful — but the
# "nobody outside reads it" premise no longer holds, and a future session
# should know that before writing in it.
# ---------------------------------------------------------------------------

[[doc]]
path  = "docs/STATUS.md"
title = "Status"
blurb = "The rolling engineering log: what the tree measures at today, what is open, and what is waiting on whom."
group = "Project"
